name: Deploy DARK//ALT demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static demo artifact
        run: |
          mkdir -p _site
          cp index.html account.html admin.html discover.html about.html _site/
          cp styles.css admin.css account.css discover.css about.css _site/
          cp app.js admin.js account.js discover.js demo-data.js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5`n        with:`n          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

